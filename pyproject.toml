[project]
name = "your-assistant-backend"
version = "2.0.0"
description = "Your Assistant - Autonomous AI Job Search & Application Tracking Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.4",
    "requests>=2.31.0",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
    "reportlab>=4.0.0",
    "types-requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
py-modules = []

[tool.pyrefly]
python-interpreter-path = "C:/Users/yeasa/anaconda3/python.exe"
search-path = [
    ".",
    "app",
    "typings",
    "C:/Users/yeasa/anaconda3/Lib/site-packages",
    "C:/Users/yeasa/AppData/Local/Python/pythoncore-3.14-64/Lib/site-packages"
]

[tool.vercel]
entrypoint = "api/index.py"

